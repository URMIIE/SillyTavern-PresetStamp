<div id="ps_settings" class="ps-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-tag" style="margin-right: 4px;"></i>Preset Stamp</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small>AI 메시지의 캐릭터 이름을 누르면 뜨는 알림에 보일 정보</small>
            <label class="checkbox_label"><input type="checkbox" data-show="model"><span>모델</span></label>
            <label class="checkbox_label"><input type="checkbox" data-show="api"><span>연결 종류 (openai · vertexai 등)</span></label>
            <label class="checkbox_label"><input type="checkbox" data-show="profile"><span>연결 프로필</span></label>
            <label class="checkbox_label"><input type="checkbox" data-show="preset"><span>프리셋</span></label>
            <label class="checkbox_label"><input type="checkbox" data-show="templates"><span>텍스트 완성 템플릿 (컨텍스트 · 지시 · 시스템 프롬프트)</span></label>
            <label class="checkbox_label"><input type="checkbox" data-show="time"><span>생성 시작 시각</span></label>
        </div>
    </div>
</div>
